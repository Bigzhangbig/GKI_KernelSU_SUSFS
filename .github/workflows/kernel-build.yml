name: Kernel Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build and Release inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-libc-dev bc bison flex libssl-dev libelf-dev \
            ccache git gh curl wget zip unzip xz-utils openssl pixz binutils-aarch64-linux-gnu apksigner
      - name: Verify build integration
        run: python -m unittest discover -s tests -v
      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: compiler-cache
        with:
          path: ~/.ccache
          key: release-ccache-${{ github.sha }}
          restore-keys: release-ccache-
      - name: Build the latest compatible official Release
        run: |
          set -euo pipefail
          workspace="/tmp/gki-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python .github/workflows/scripts/build.py \
            --workspace "$workspace" --output-json "$workspace/build-result.json"
      - name: Collect original kernel and exact build evidence
        run: |
          set -euo pipefail
          workspace="/tmp/gki-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_dir="$workspace/android12-5.10-209"
          mkdir -p original
          cp "$build_dir/android12-5.10.209-2024-05-AnyKernel3.zip" original/
          cp "$build_dir/release-manifest.json" original/
          cp "$build_dir/release-target.json" original/
          cp "$build_dir/release-resolved-manifest.xml" original/
          cp "$workspace/build-result.json" original/
          cp "$build_dir/common/arch/arm64/configs/gki_defconfig" original/gki_defconfig
          cp "$build_dir/out/android12-5.10/common/.config" original/kernel.config
          cp "$build_dir/out/android12-5.10/dist/vmlinux" original/
          cp "$build_dir/out/android12-5.10/dist/System.map" original/
          (cd original && sha256sum ./* > SHA256SUMS.txt)
      - name: Verify packaged Image and export compact evidence
        id: inspect
        run: |
          python .github/workflows/scripts/inspect_release.py \
            --input original --kernel-only kernel-release --evidence evidence-release \
            --build-run-id "$GITHUB_RUN_ID"
      - name: Upload verified AnyKernel3 ZIP
        uses: actions/upload-artifact@v7
        with:
          name: kernel-release
          path: kernel-release/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failed inspection input
        if: ${{ failure() && steps.inspect.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: unverified-release-inspection-input
          path: original/
          if-no-files-found: warn
          retention-days: 3
      - name: Upload compact build and binary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: evidence-release
          path: evidence-release/
          if-no-files-found: warn
          retention-days: 14
      - name: Save compiler cache after successful or failed builds
        if: ${{ always() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: release-ccache-${{ github.sha }}
