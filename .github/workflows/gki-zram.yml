name: Standard GKI zram

on:
  push:
    branches: [codex/k50-gki-zram-standalone-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare compiler dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev liblz4-tool \
            cpio rsync kmod dwarves binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
            libtinfo5 libncurses5 git curl xz-utils \
            file python3 unzip zip zstd
          df -h "$RUNNER_TEMP"
      - name: Compile the ARM64 kernel
        run: bash build.sh "$RUNNER_TEMP/gki-zram"
      - name: Verify the compiled image
        run: python3 verify.py "$RUNNER_TEMP/gki-zram" "$RUNNER_TEMP/verified-zram"
      - name: Upload image and verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: standard-gki-arm64-zram-lz4kd
          path: ${{ runner.temp }}/verified-zram/
          if-no-files-found: error
          retention-days: 30
