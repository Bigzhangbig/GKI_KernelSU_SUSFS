name: Build official 40971-5 (UAPI5 + SUSFS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-swapfile: 'true'

      - name: Checkout build scripts and pinned patch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential linux-libc-dev bc bison flex libssl-dev libelf-dev \
            ccache git curl wget zip unzip xz-utils openssl pixz

      - name: Verify target integration
        run: python3 -m unittest discover -s tests -v

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: official-40971-5-ccache-${{ github.sha }}
          restore-keys: official-40971-5-ccache-

      - name: Build pinned official GKI
        run: |
          workspace="/tmp/gki-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 .github/workflows/scripts/build.py \
            --official-40971-5 \
            --android android12 --kernel 5.10 --sub-level 209 \
            --os-patch 2024-05 --revision r13 \
            --ksu-commit 6c284e957feaa9a388a9f1c37dc4ec80d95e434b \
            --susfs-commit 9892175b4acec7ee844e113b8d02c0f4d12cdfac \
            --no-kpm --no-release \
            --workspace "$workspace" --output-json "$workspace/build-result.json"

      - name: Prepare review artifacts
        run: |
          set -euo pipefail
          workspace="/tmp/gki-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          build_dir="$workspace/android12-5.10-209"
          mkdir -p artifacts
          cp "$build_dir/android12-5.10.209-2024-05-AnyKernel3.zip" artifacts/
          cp "$build_dir/40971-5-manifest.json" artifacts/
          cp "$workspace/build-result.json" artifacts/
          cp "$build_dir/common/arch/arm64/configs/gki_defconfig" artifacts/gki_defconfig
          cp "$build_dir/out/android12-5.10/common/.config" artifacts/kernel.config
          cp "$build_dir/out/android12-5.10/dist/vmlinux" artifacts/
          cp "$build_dir/out/android12-5.10/dist/System.map" artifacts/
          cp "$build_dir/40971-5-resolved-manifest.xml" artifacts/
          test -s artifacts/android12-5.10.209-2024-05-AnyKernel3.zip
          test -s artifacts/vmlinux
          test -s artifacts/System.map
          (cd artifacts && sha256sum ./* > SHA256SUMS.txt)

      - name: Upload AnyKernel3 and build evidence
        uses: actions/upload-artifact@v7
        with:
          name: official-40971-5-uapi5-susfs
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
